name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # application-secret.yaml is gitignored (local-dev only, never committed).
      # Spring requires it to exist because application.yaml declares
      # `spring.profiles.include: secret`. This step recreates it here,
      # on the ephemeral CI runner only — it never touches the developer's
      # local copy and is discarded when the job ends.
      - name: Write CI-only secret profile
        run: |
          cat > src/main/resources/application-secret.yaml <<'EOF'
          jwt:
            secret: ${JWT_SECRET}
            expiration: ${JWT_EXPIRATION:3600000}
          EOF

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Copy build artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile,docker-compose.prod.yml,nginx/**"
          target: "~/songeul"

      - name: Restart containers on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/songeul
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
