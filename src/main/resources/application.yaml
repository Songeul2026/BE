server:
  forward-headers-strategy: framework

spring:
  application:
    name: songeul
  profiles:
    include: secret
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/songeul}
    username: ${DB_USERNAME:songeul}
    password: ${DB_PASSWORD:son0502geul}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload:
    dir: uploads/images
