server:
  forward-headers-strategy: framework

spring:
  application:
    name: songeul
  profiles:
    include: secret
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/songeul}
    username: ${DB_USERNAME:songeul}
    password: ${DB_PASSWORD:son0502geul}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  upload:
    dir: uploads/images
  storage:
    type: ${STORAGE_TYPE:local}
    bucket: ${STORAGE_BUCKET:}
    region: ${STORAGE_REGION:ap-southeast-2}
  ocr:
    base-url: ${OCR_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${OCR_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OCR_READ_TIMEOUT_MS:20000}
