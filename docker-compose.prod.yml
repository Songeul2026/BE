services:
  postgres:
    image: postgres:16
    container_name: songeul-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-songeul}
      POSTGRES_USER: ${DB_USERNAME:-songeul}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME:-songeul}", "-d", "${DB_NAME:-songeul}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: songeul-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-songeul}
      DB_USERNAME: ${DB_USERNAME:-songeul}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
